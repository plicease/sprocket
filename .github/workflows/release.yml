name: Release

on:
  push:
    branches: [main]


concurrency: release-${{ github.ref }}


permissions:
  contents: write


jobs:
  release:
    uses: uperl/action-rust-release-bin/.github/workflows/release.yml@v1
    with:
      publisher: "plicease"

  # When `release` has made v<version>, SPROCKET.EXE for DOS is attached to
  # it as sprocket.exe, built from the same commit with the pinned libc16
  # and the Open Watcom it names (client/dos/fetch-libc16, fetch-watcom),
  # its version checked against Cargo.toml's, with its license notice as
  # sprocket-exe-license.txt. The asset's name and contents are a contract with GR-DOS,
  # which ships it (client/dos/README.md, "Releases").
  #
  # It does not wait on every host build: `release` fails when any one of
  # them does (v0.5.0's aarch64-apple-darwin runner was refused), and that
  # left v0.5.0 without sprocket.exe. So it runs unless the run was
  # cancelled, whenever the version changed and the release was tagged.
  dos:
    name: DOS client
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: client/dos
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the version
        run: |
          make check-version
          test "$(make -s check-version)" = "SPROCKET.EXE version $VERSION"

      - name: Build SPROCKET.EXE
        run: |
          watcom=$(./fetch-watcom)
          make WATCOM="$watcom"
          make WATCOM="$watcom" check-map
          cp build/SPROCKET.EXE build/sprocket.exe
          sha256sum build/sprocket.exe

      # The executable contains libc16, so its MIT notice goes with it. One
      # notice covers both while SPROCKET's LICENSE and libc16's have the
      # same text and holder; the check fails the release if they diverge
      # (docs/licensing.md, "DOS client runtime").
      - name: Check that LICENSE covers libc16
        run: cmp ../../LICENSE build/libc16/LICENSE

      - name: Attach sprocket.exe and its license to v${{ needs.release.outputs.version }}
        run: |
          cp ../../LICENSE build/sprocket-exe-license.txt
          gh release upload "v$VERSION" build/sprocket.exe build/sprocket-exe-license.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
