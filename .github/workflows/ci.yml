name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: uperl/action-rust-ci/.github/workflows/ci.yml@v1

  # SPROCKET.EXE, with the pinned Open Watcom (client/dos/fetch-watcom), as
  # the release builds it: its version must be Cargo.toml's, a second build
  # must be byte for byte the same, and the host tests must pass.
  dos:
    name: DOS client
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: client/dos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: client/dos/build/tools
          key: watcom-ubuntu-24.04-${{ hashFiles('client/dos/fetch-watcom') }}

      - name: Check the version
        run: make check-version

      - name: Build SPROCKET.EXE twice
        run: |
          watcom=$(./fetch-watcom)
          make WATCOM="$watcom"
          cp build/SPROCKET.EXE build/first.exe
          touch src/*.c
          make WATCOM="$watcom"
          cmp build/first.exe build/SPROCKET.EXE
          sha256sum build/SPROCKET.EXE

      - name: Host tests
        run: make test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SPROCKET.EXE
          path: client/dos/build/SPROCKET.EXE
          if-no-files-found: error
