[package]
name = "sprocket"
version = "0.1.0"
edition = "2024"
description = "Serial Protocol Rocket"
repository = "https://github.com/plicease/sprocket"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serialport = { version = "4.10.1", default-features = false }
zmodem2 = "0.7.3"

[dev-dependencies]
tempfile = "3.27.0"


[package.metadata.deb]
maintainer = "Graham Ollis <plicease@cpan.org>"
copyright = "2026, Graham Ollis"
extended-description = """\
Serial Protocol Rocket"""
section = "utils"
priority = "optional"
assets = [
    ["target/release/sprocket", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/sprocket/README.md", "644"],
    ["LICENSE", "usr/share/doc/sprocket/LICENSE", "644"],
]

